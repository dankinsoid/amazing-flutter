name: amazing_flutter
description: GPU shader effects for Flutter — liquid glass, water, and composed height fields.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/liquid_glass.frag
    - shaders/disintegration.frag
    - shaders/fluid_advection.frag
    - shaders/fluid_curl.frag
    - shaders/fluid_divergence.frag
    - shaders/fluid_display.frag
    - shaders/fluid_gradient.frag
    - shaders/fluid_pressure.frag
    - shaders/fluid_splat.frag
    - shaders/fluid_vorticity.frag
